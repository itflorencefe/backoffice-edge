# Minimal Supabase config for `supabase db push`
# Remote project ref is set via `supabase link`, not here.
# Full reference: https://supabase.com/docs/guides/cli/config
project_id = "bolt-migration"

[api]
# Local stack only (npm run local:start): back office tables in `backoffice`, app tables in `application`.
schemas = ["public", "graphql_public", "backoffice", "application"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ['./seeds/*.sql']

[db.pooler]
enabled = false

[functions.bolt-auth-proxy]
verify_jwt = false

[functions.static-env-proxy]
verify_jwt = false

[functions.gamification-proxy]
verify_jwt = false

[functions.pulsar]
verify_jwt = false

[functions.smart-journey]
verify_jwt = false

[functions.get-product-config]
verify_jwt = false

[functions.atom]
verify_jwt = false

[functions.get-product-packs]
verify_jwt = false

[functions.screen-layout]
verify_jwt = false

[functions.clone-product]
verify_jwt = true

[functions.clone-service]
verify_jwt = true

[functions.dvlive]
verify_jwt = false
